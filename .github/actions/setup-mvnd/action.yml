name: 'Setup Maven Daemon'
description: 'Install and cache the mvnd native GraalVM binary'
inputs:
  version:
    description: 'mvnd version to install'
    required: true
outputs:
  mvn_cmd:
    description: 'Command to use: mvnd if available, mvn as fallback'
    value: ${{ steps.verify.outputs.mvnd_available == 'true' && 'mvnd' || 'mvn' }}
runs:
  using: composite
  steps:
    - name: Determine mvnd archive name
      id: platform
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        case "${RUNNER_OS_NAME}" in
          Linux)   echo "archive=maven-mvnd-${VERSION}-linux-amd64" >> $GITHUB_OUTPUT ;;
          macOS)   echo "archive=maven-mvnd-${VERSION}-darwin-aarch64" >> $GITHUB_OUTPUT ;;
          Windows) echo "archive=maven-mvnd-${VERSION}-windows-amd64" >> $GITHUB_OUTPUT ;;
        esac

    - name: Cache mvnd archive
      id: cache-mvnd
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/mvnd.zip
        key: mvnd-v2-${{ runner.os }}-${{ inputs.version }}

    # Failures here must not fail the job: the mvn_cmd output falls back to mvn.
    # downloads.apache.org only keeps the latest releases, so older versions
    # are fetched from archive.apache.org.
    - name: Download, verify and extract mvnd
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ARCHIVE: ${{ steps.platform.outputs.archive }}
        CACHE_HIT: ${{ steps.cache-mvnd.outputs.cache-hit }}
      run: |
        fetch() {
          for base in https://downloads.apache.org/maven https://archive.apache.org/dist/maven; do
            curl -fsL "${base}/$1" -o "$2" && return 0
          done
          return 1
        }

        install_mvnd() {
          if [ "${CACHE_HIT}" != 'true' ]; then
            fetch "mvnd/${VERSION}/${ARCHIVE}.zip" "${RUNNER_TEMP}/mvnd.zip" || return 1
          fi

          fetch "mvnd/${VERSION}/${ARCHIVE}.zip.sha512" "${RUNNER_TEMP}/mvnd.zip.sha512" || return 1
          echo "$(cat "${RUNNER_TEMP}/mvnd.zip.sha512")  ${RUNNER_TEMP}/mvnd.zip" | sha512sum -c - || return 1

          # GPG signature verification
          fetch "KEYS" "${RUNNER_TEMP}/KEYS" || return 1
          gpg --import --quiet "${RUNNER_TEMP}/KEYS" 2>/dev/null || return 1
          fetch "mvnd/${VERSION}/${ARCHIVE}.zip.asc" "${RUNNER_TEMP}/mvnd.zip.asc" || return 1
          gpg --verify "${RUNNER_TEMP}/mvnd.zip.asc" "${RUNNER_TEMP}/mvnd.zip" || return 1

          unzip -q "${RUNNER_TEMP}/mvnd.zip" -d "${RUNNER_TEMP}/mvnd" || return 1
        }

        if install_mvnd; then
          echo "installed=true" >> $GITHUB_OUTPUT
        else
          echo "::warning::mvnd ${VERSION} could not be downloaded or verified, falling back to mvn"
          # Do not let the post-job cache step save a missing or corrupted archive
          rm -f "${RUNNER_TEMP}/mvnd.zip"
          echo "installed=false" >> $GITHUB_OUTPUT
        fi

    - name: Add mvnd to PATH
      if: steps.install.outputs.installed == 'true'
      shell: bash
      env:
        ARCHIVE: ${{ steps.platform.outputs.archive }}
      run: echo "${RUNNER_TEMP}/mvnd/${ARCHIVE}/bin" >> $GITHUB_PATH

    - name: Verify mvnd
      id: verify
      if: steps.install.outputs.installed == 'true'
      shell: bash
      run: |
        if mvnd --version; then
          echo "mvnd_available=true" >> $GITHUB_OUTPUT
        else
          echo "::warning::mvnd daemon failed to start, falling back to mvn"
          echo "mvnd_available=false" >> $GITHUB_OUTPUT
        fi
